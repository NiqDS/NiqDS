name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safeword
          POSTGRES_PASSWORD: safeword
          POSTGRES_DB: safeword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safeword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://safeword:safeword@localhost:5432/safeword
      JWT_ACCESS_SECRET: ci-access-secret-0123456789-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-0123456789
      APPLE_CLIENT_ID: com.example.safeword
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test

  ios:
    name: iOS (generate · build · test)
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build & test (mockable mic layer — no hardware needed)
        run: |
          xcodebuild test \
            -project SafeWord.xcodeproj \
            -scheme SafeWord \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}
