# Fly.io deployment (volume-native, simplest stateful option).
#   fly launch --no-deploy      # creates the app, imports this file
#   fly volumes create intake_data --size 1
#   fly secrets set INTAKE_SECRET=$(openssl rand -hex 32) OAUTH_REDIRECT_BASE=https://<app>.fly.dev
#   fly deploy
app = "intake-gate"            # change to your app name
primary_region = "lhr"         # London

[build]

[env]
  INTAKE_DATA_DIR = "/data"
  LLM_BACKEND = "mock"
  INTAKE_SESSION_SECURE = "1"
  INTAKE_HSTS = "1"
  INTAKE_RETENTION_DAYS = "30"

[[mounts]]
  source = "intake_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
