# Fly.io deployment (volume-native, simplest stateful option).
# Full copy-paste runbook: docs/setup/deploy.md → "Option 1 — Fly.io". In short:
#   APP=intake-gate-nick; sed -i '' "s/^app = .*/app = \"$APP\"/" fly.toml
#   fly apps create "$APP"
#   fly volumes create intake_data --size 1 --region lhr --app "$APP" --yes
#   fly secrets set --app "$APP" INTAKE_SECRET=$(openssl rand -hex 32) OAUTH_REDIRECT_BASE=https://$APP.fly.dev
#   fly deploy --app "$APP"                       # add --build-arg WITH_LLM=1 to read photos
app = "intake-gate"            # change to your app name (see deploy.md)
primary_region = "lhr"         # London

[build]

[env]
  INTAKE_DATA_DIR = "/data"
  LLM_BACKEND = "mock"
  INTAKE_SESSION_SECURE = "1"
  INTAKE_HSTS = "1"
  INTAKE_RETENTION_DAYS = "30"

[[mounts]]
  source = "intake_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
