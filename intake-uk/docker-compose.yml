# Local production-like run:  docker compose up --build
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      INTAKE_DATA_DIR: /data
      LLM_BACKEND: mock
      INTAKE_SECRET: change-me-to-a-long-random-string
      INTAKE_RETENTION_DAYS: "30"
      # In real production behind HTTPS also set:
      # INTAKE_SESSION_SECURE: "1"
      # INTAKE_HSTS: "1"
      # OAUTH_REDIRECT_BASE: https://your-domain
    volumes:
      - intake-data:/data
volumes:
  intake-data:
