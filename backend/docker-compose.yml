# Local development dependencies for the SafeWord backend.
# `docker compose up -d` then `npm run migrate && npm run dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safeword
      POSTGRES_PASSWORD: safeword
      POSTGRES_DB: safeword
    ports:
      - '5432:5432'
    volumes:
      - safeword_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safeword']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for local dev (MinIO). Mirrors the provider-agnostic
  # storage decision; production uses AWS S3 / R2 / Tigris / etc.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: safeword
      MINIO_ROOT_PASSWORD: safeword-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - safeword_minio:/data

volumes:
  safeword_pg:
  safeword_minio:
