# XcodeGen spec — the .xcodeproj is generated, never hand-edited.
#   brew install xcodegen && xcodegen generate && open SafeWord.xcodeproj
name: SafeWord
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: '' # set for signed/device builds
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SafeWord:
    type: application
    platform: iOS
    sources:
      - path: SafeWord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.safeword
        INFOPLIST_FILE: SafeWord/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SafeWord/Resources/SafeWord.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1' # iPhone

  SafeWordTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SafeWordTests
    dependencies:
      - target: SafeWord
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.safeword.tests

schemes:
  SafeWord:
    build:
      targets:
        SafeWord: all
        SafeWordTests: [test]
    test:
      targets:
        - SafeWordTests
      gatherCoverageData: true
