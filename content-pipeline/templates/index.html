<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Pipeline</title>
  <style>
    :root {
      --bg: #0d0e12;
      --panel: #11121a;
      --card: #16181f;
      --border: #1e2028;
      --border2: #2a2c35;
      --text: #c8c5be;
      --text-head: #f5f2ea;
      --muted: #4a4c55;
      --muted2: #6b6965;
      --error: #e87a4b;
      --success: #4be87a;
      --accent-tue: #e8534b;
      --accent-thu: #4b8fe8;
      --accent-fri-li: #9b6fe8;
      --accent-fri-sub: #e8a84b;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    textarea:focus, input:focus { outline: none; border-color: #3a3c45 !important; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .layout { display: flex; width: 100%; min-height: 100vh; }

    /* LEFT PANEL */
    .left {
      width: 280px; min-width: 260px; background: var(--panel);
      border-right: 1px solid var(--border); padding: 1.2rem;
      overflow-y: auto; display: flex; flex-direction: column;
      gap: 0.6rem; flex-shrink: 0;
    }
    .brand { display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.4rem; }
    .brand-icon { font-size: 1.2rem; margin-top: 2px; }
    .brand-title { font-size: 0.95rem; font-weight: 700; color: var(--text-head); }
    .brand-sub { font-size: 0.65rem; color: var(--muted); line-height: 1.4; }
    .divider { height: 1px; background: var(--border); margin: 0.4rem 0; }
    .label {
      font-size: 0.6rem; letter-spacing: 0.12em; color: var(--muted);
      font-weight: 600; margin-top: 0.2rem; text-transform: uppercase;
    }
    .input, textarea.input {
      width: 100%; padding: 0.5rem 0.6rem; background: var(--bg);
      border: 1px solid var(--border); border-radius: 4px; color: var(--text);
      font-size: 0.82rem; font-family: system-ui, sans-serif;
    }
    textarea.input { resize: vertical; line-height: 1.5; }

    .arc-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.75rem; margin-top: 0.2rem;
    }
    .arc-title { font-size: 0.7rem; font-weight: 700; color: var(--muted2); margin-bottom: 0.5rem; }
    .arc-row { display: flex; align-items: center; font-size: 0.75rem; color: var(--muted2); margin-bottom: 0.25rem; }
    .arc-label { flex: 1; color: #8a8880; }

    .gen-all-btn {
      width: 100%; padding: 0.7rem; background: var(--accent-tue); color: #fff;
      border: none; border-radius: 5px; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; margin-top: 0.4rem; letter-spacing: 0.01em;
    }
    .gen-all-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .recent-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; cursor: pointer; }
    .recent-label { font-size: 0.75rem; color: var(--muted2); }

    /* RIGHT PANEL */
    .right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--panel); overflow-x: auto; }
    .tab {
      padding: 0.75rem 1rem; background: transparent; border: none;
      border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer;
      font-size: 0.82rem; display: flex; align-items: center; gap: 4px;
      white-space: nowrap; font-family: system-ui, sans-serif;
    }
    .tab.active { color: var(--text); }
    .tab-tag { font-size: 0.65rem; padding: 0.1rem 0.4rem; border-radius: 3px; margin-left: 2px; }

    .draft-area { flex: 1; display: flex; flex-direction: column; }
    .draft-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 1rem 1.2rem 0.8rem; border-bottom: 1px solid var(--border);
      gap: 1rem; flex-wrap: wrap;
    }
    .draft-title { font-size: 1rem; font-weight: 700; color: var(--text-head); margin-bottom: 0.2rem; }
    .draft-sub { font-size: 0.75rem; color: var(--muted); line-height: 1.4; }
    .draft-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .action-btn {
      padding: 0.35rem 0.8rem; background: transparent; border: 1px solid var(--border2);
      border-radius: 4px; color: var(--muted2); cursor: pointer; font-size: 0.78rem;
      font-family: system-ui, sans-serif;
    }
    .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .gen-btn { font-weight: 600; }

    .draft-inner { flex: 1; padding: 1rem 1.2rem; overflow-y: auto; }
    .tab-line { font-size: 0.72rem; color: var(--border2); margin-bottom: 0.8rem; font-family: monospace; }

    .loading-box { display: flex; align-items: center; gap: 0.6rem; color: var(--muted); font-size: 0.85rem; padding: 2rem 0; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--border);
      border-top: 2px solid var(--accent-tue); border-radius: 50%;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    .error-box { color: var(--error); font-size: 0.85rem; padding: 1rem 0; }
    .empty-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 300px; gap: 1rem; color: var(--border2);
    }
    .empty-icon { font-size: 2rem; filter: grayscale(1) opacity(0.3); }
    .empty-text { font-size: 0.82rem; color: #3a3c45; text-align: center; line-height: 1.6; white-space: pre-line; }

    .article-body { line-height: 1.75; }
    .article-body h1 { font-size: 1.2rem; font-weight: 700; color: var(--text-head); margin: 0 0 0.6rem; line-height: 1.3; }
    .article-body h2 {
      font-size: 0.75rem; font-weight: 700; color: #8a8880; margin: 1.2rem 0 0.3rem;
      letter-spacing: 0.03em; text-transform: uppercase;
    }
    .article-body p { font-size: 0.88rem; color: var(--text); margin: 0 0 0.6rem; line-height: 1.7; }
    .article-body strong { color: var(--text-head); }
    .article-body ul, .article-body ol { font-size: 0.88rem; line-height: 1.7; padding-left: 1.2rem; }

    .status-bar {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1.2rem;
      border-top: 1px solid var(--border); background: var(--panel);
    }
    .status-text { font-size: 0.72rem; color: #3a3c45; }
  </style>
</head>
<body>
  <div class="layout">
    <!-- LEFT PANEL -->
    <div class="left">
      <div class="brand">
        <div class="brand-icon">📰</div>
        <div>
          <div class="brand-title">Content Pipeline</div>
          <div class="brand-sub">Digital Economics · AI · Finance · Financial Literacy</div>
        </div>
      </div>

      <div class="divider"></div>

      <label class="label">Week #</label>
      <input class="input" id="week" placeholder="4" />

      <label class="label">Topic / Arc Title</label>
      <input class="input" id="topic" placeholder="e.g. Who controls AI in finance?" />

      <label class="label">Arc Thesis (the conclusion)</label>
      <textarea class="input" id="thesis" style="min-height:72px" placeholder="One sentence capturing the week's conclusion…"></textarea>

      <label class="label">Source Notes & Key Data</label>
      <textarea class="input" id="notes" style="min-height:130px" placeholder="Paste research notes, key stats, source names, quotes…&#10;&#10;All drafts are grounded in these."></textarea>

      <label class="label">Next Week's Tease</label>
      <input class="input" id="tease" placeholder="e.g. CBDC pilots in 130 countries…" />

      <div class="arc-box">
        <div class="arc-title">Arc Model</div>
        <div id="arc-list"></div>
      </div>

      <button class="gen-all-btn" id="gen-all-btn" disabled>⚡ Generate All Four Drafts</button>

      <div id="recent-section"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right">
      <div class="tabs" id="tabs"></div>

      <div class="draft-area">
        <div class="draft-header">
          <div>
            <div class="draft-title" id="draft-title"></div>
            <div class="draft-sub" id="draft-sub"></div>
          </div>
          <div class="draft-actions">
            <button class="action-btn" id="copy-btn" style="display:none">Copy</button>
            <button class="action-btn gen-btn" id="gen-btn" disabled>Generate</button>
          </div>
        </div>

        <div class="draft-inner">
          <div class="tab-line" id="tab-line"></div>
          <div id="draft-content"></div>
        </div>

        <div class="status-bar">
          <span id="status-dot" style="color:#3a3c45">●</span>
          <span class="status-text" id="status-text">Waiting for topic, thesis, and source notes</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DRAFTS = [
      { id: "tue", label: "Tuesday", tag: "400w", color: "#e8534b",
        title: "Movement I — Tuesday LinkedIn",
        subtitle: "The Question · ~400 words · Opens with one striking data point, poses the central question, teases Thu + Fri",
        kind: "LinkedIn", movement: "The Question" },
      { id: "thu", label: "Thursday", tag: "850w", color: "#4b8fe8",
        title: "Movement II — Thursday Deep Dive",
        subtitle: "The Evidence · ~850 words · Answers the question with data, analysis, and structured argument",
        kind: "LinkedIn", movement: "The Evidence" },
      { id: "fri-li", label: "Fri LinkedIn", tag: "500w", color: "#9b6fe8",
        title: "Movement III — Friday LinkedIn",
        subtitle: "Preview + Results · ~500w · Bridges the week, links to Substack, teases next week",
        kind: "LinkedIn", movement: "Preview + Results" },
      { id: "fri-sub", label: "Fri Substack", tag: "2100w", color: "#e8a84b",
        title: "Movement IV — Friday Substack",
        subtitle: "Full Article · ~2100 words · The definitive piece, grounded in source notes",
        kind: "Substack", movement: "Full Article" },
    ];

    const STATUS = { IDLE: "idle", LOADING: "loading", DONE: "done", ERROR: "error" };

    const state = {
      activeTab: "tue",
      drafts: { "tue": "", "thu": "", "fri-li": "", "fri-sub": "" },
      html: { "tue": "", "thu": "", "fri-li": "", "fri-sub": "" },
      statuses: { "tue": STATUS.IDLE, "thu": STATUS.IDLE, "fri-li": STATUS.IDLE, "fri-sub": STATUS.IDLE },
      errors: {},
      wordCounts: {},
    };

    const $ = (id) => document.getElementById(id);
    const inputs = ["week", "topic", "thesis", "notes", "tease"];
    const getField = (f) => $(f).value;
    const isReady = () => getField("topic").trim() && getField("thesis").trim() && getField("notes").trim();
    const draftById = (id) => DRAFTS.find(d => d.id === id);

    // ── Build static left/tab UI ──
    function buildArcList() {
      $("arc-list").innerHTML = DRAFTS.map(d => `
        <div class="arc-row">
          <span style="color:${d.color};margin-right:6px">→</span>
          <span class="arc-label">${d.label}</span>
          <span style="color:#4a4c55">${d.tag}</span>
        </div>`).join("");
    }

    function buildTabs() {
      $("tabs").innerHTML = DRAFTS.map(d => {
        const st = state.statuses[d.id];
        const active = state.activeTab === d.id;
        const mark = st === STATUS.DONE ? "✓" : st === STATUS.LOADING ? "…" : st === STATUS.ERROR ? "!" : "·";
        const tagBg = active ? d.color + "22" : "transparent";
        const tagColor = active ? d.color : "#4a4c55";
        return `
          <button class="tab ${active ? "active" : ""}" data-id="${d.id}"
                  style="${active ? `border-bottom-color:${d.color}` : ""}">
            <span style="color:${active ? d.color : "#4a4c55"};margin-right:5px">${mark}</span>
            ${d.label}
            <span class="tab-tag" style="background:${tagBg};color:${tagColor}">${d.tag}</span>
          </button>`;
      }).join("");
      document.querySelectorAll(".tab").forEach(t =>
        t.addEventListener("click", () => { state.activeTab = t.dataset.id; render(); }));
    }

    function buildRecent() {
      const entries = DRAFTS.filter(d => state.drafts[d.id]);
      if (!entries.length) { $("recent-section").innerHTML = ""; return; }
      const topic = getField("topic") || "Untitled";
      $("recent-section").innerHTML = `
        <div class="divider"></div>
        <div class="label">Recent Weeks</div>
        ${entries.map(d => `
          <div class="recent-row" data-id="${d.id}">
            <span style="color:${d.color};font-size:0.7rem">●</span>
            <span class="recent-label">${d.label} · ${topic}</span>
          </div>`).join("")}`;
      document.querySelectorAll(".recent-row").forEach(r =>
        r.addEventListener("click", () => { state.activeTab = r.dataset.id; render(); }));
    }

    // ── Render the active draft panel ──
    function render() {
      buildTabs();
      buildRecent();
      const d = draftById(state.activeTab);
      const st = state.statuses[d.id];
      const text = state.drafts[d.id];

      $("draft-title").textContent = d.title;
      $("draft-sub").textContent = d.subtitle;
      $("tab-line").textContent = `${d.label.slice(0,3)} · ${d.kind} · ${d.movement}`;

      // Copy button
      const copyBtn = $("copy-btn");
      copyBtn.style.display = text ? "inline-block" : "none";
      copyBtn.textContent = "Copy";

      // Generate button
      const genBtn = $("gen-btn");
      genBtn.disabled = !isReady() || st === STATUS.LOADING;
      genBtn.textContent = st === STATUS.LOADING ? "Writing…" : "Generate";
      genBtn.style.borderColor = d.color + "66";
      genBtn.style.color = d.color;

      // Content area
      const c = $("draft-content");
      if (st === STATUS.LOADING) {
        c.innerHTML = `<div class="loading-box"><div class="spinner"></div><span>Writing ${d.label} draft…</span></div>`;
      } else if (st === STATUS.ERROR) {
        c.innerHTML = `<div class="error-box">⚠ ${state.errors[d.id] || "Error"}</div>`;
      } else if (st === STATUS.DONE && text) {
        c.innerHTML = `<div class="article-body">${state.html[d.id]}</div>`;
      } else {
        c.innerHTML = `
          <div class="empty-box">
            <div class="empty-icon">✍️</div>
            <div class="empty-text">${isReady()
              ? "Ready · Click Generate or ⚡ Generate All"
              : "Fill in the topic, thesis, and source notes,\nthen click Generate or ⚡ Generate All."}</div>
          </div>`;
      }

      // Status bar
      const dotColor = st === STATUS.DONE ? "#4be87a" : st === STATUS.LOADING ? d.color : "#3a3c45";
      $("status-dot").style.color = dotColor;
      $("status-text").textContent =
        st === STATUS.DONE ? `Done · ${state.wordCounts[d.id]} words` :
        st === STATUS.LOADING ? `Generating ${d.tag} draft…` :
        st === STATUS.ERROR ? "Error — try again" :
        isReady() ? "Ready · Enter topic and source notes on the left" :
        "Waiting for topic, thesis, and source notes";

      // Generate All button
      $("gen-all-btn").disabled = !isReady() || anyLoading();
    }

    function anyLoading() {
      return Object.values(state.statuses).some(s => s === STATUS.LOADING);
    }

    function payload(draftId) {
      return {
        draft_id: draftId,
        week: getField("week"),
        topic: getField("topic"),
        thesis: getField("thesis"),
        notes: getField("notes"),
        tease: getField("tease"),
      };
    }

    function applyResult(id, res) {
      state.drafts[id] = res.content;
      state.html[id] = res.content_html;
      state.wordCounts[id] = res.word_count;
      state.statuses[id] = STATUS.DONE;
    }

    async function generateOne(id) {
      if (!isReady()) return;
      state.statuses[id] = STATUS.LOADING;
      state.errors[id] = null;
      render();
      try {
        const r = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload(id)),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "API error");
        applyResult(id, data);
      } catch (e) {
        state.errors[id] = e.message;
        state.statuses[id] = STATUS.ERROR;
      }
      render();
    }

    async function generateAll() {
      if (!isReady()) return;
      DRAFTS.forEach(d => { state.statuses[d.id] = STATUS.LOADING; state.errors[d.id] = null; });
      render();
      // Sequential — update each tab as its response lands.
      for (const d of DRAFTS) {
        try {
          const r = await fetch("/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload(d.id)),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "API error");
          applyResult(d.id, data);
        } catch (e) {
          state.errors[d.id] = e.message;
          state.statuses[d.id] = STATUS.ERROR;
        }
        render();
      }
    }

    function copyActive() {
      const text = state.drafts[state.activeTab];
      if (!text) return;
      navigator.clipboard.writeText(text);
      const btn = $("copy-btn");
      btn.textContent = "✓ Copied";
      setTimeout(() => { btn.textContent = "Copy"; }, 2000);
    }

    // ── Wire up ──
    buildArcList();
    inputs.forEach(f => $(f).addEventListener("input", render));
    $("gen-btn").addEventListener("click", () => generateOne(state.activeTab));
    $("gen-all-btn").addEventListener("click", generateAll);
    $("copy-btn").addEventListener("click", copyActive);
    render();
  </script>
</body>
</html>
